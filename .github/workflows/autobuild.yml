name: Autobuild (möte → prototyp)

# Drag 3: MeetGeek-möte → Canon-analys → /new-build → preview → PR med /lab-kort.
#
# Två sätt att trigga:
#   - repository_dispatch (meetgeek-meeting): från /api/meetgeek-webhook, prod-flödet
#   - workflow_dispatch: manuell test. Klistra in en brief direkt (hoppar över MeetGeek + analys)
#     ELLER ange ett meeting_id som hämtas + analyseras.
#
# Krävda secrets (Settings → Secrets and variables → Actions):
#   MEETGEEK_API_KEY      – hämtar transkript (server-to-server)
#   ANTHROPIC_API_KEY     – Claude headless (analys + /new-build) i CI
#   VERCEL_TOKEN          – preview-deploy
#   GH_PAT                – skapa projekt-repo + öppna PR (repo-scope)

on:
  repository_dispatch:
    types: [meetgeek-meeting, autobuild]
  workflow_dispatch:
    inputs:
      project_name:
        description: "Projektnamn (kebab-case). Tomt = härleds från briefen."
        required: false
      brief:
        description: "Klistra in en brief direkt (test). Lämna tomt för att hämta från MeetGeek."
        required: false
      meeting_id:
        description: "MeetGeek meeting_id att hämta (om ingen brief klistras in)."
        required: false

concurrency:
  group: autobuild-${{ github.event.client_payload.meeting_id || github.event.inputs.meeting_id || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout surprisesystems
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Härled indata
        id: input
        env:
          # brief kan komma från Telegram (client_payload.brief) eller manuell test (inputs.brief)
          CP_BRIEF: ${{ github.event.client_payload.brief }}
          IN_BRIEF: ${{ github.event.inputs.brief }}
        run: |
          MEETING_ID="${{ github.event.client_payload.meeting_id || github.event.inputs.meeting_id }}"
          PROJECT_NAME="${{ github.event.client_payload.project_name || github.event.inputs.project_name }}"
          echo "meeting_id=$MEETING_ID" >> "$GITHUB_OUTPUT"
          echo "project_name=$PROJECT_NAME" >> "$GITHUB_OUTPUT"
          BRIEF="${CP_BRIEF:-$IN_BRIEF}"
          echo "manual_brief<<EOF" >> "$GITHUB_OUTPUT"
          echo "$BRIEF" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Hämta transkript från MeetGeek
        if: steps.input.outputs.meeting_id != '' && steps.input.outputs.manual_brief == ''
        env:
          MEETGEEK_API_KEY: ${{ secrets.MEETGEEK_API_KEY }}
          MEETING_ID: ${{ steps.input.outputs.meeting_id }}
        run: |
          # OBS: verifiera exakt endpoint mot docs.meetgeek.ai
          curl -sS -H "Authorization: Bearer $MEETGEEK_API_KEY" \
            "https://api.meetgeek.ai/v1/meetings/$MEETING_ID/transcript" \
            -o transcript.json
          node -e "const t=require('./transcript.json'); const s=JSON.stringify(t); require('fs').writeFileSync('source.txt', s.slice(0,20000));"

      - name: Använd inklistrad brief (testläge)
        if: steps.input.outputs.manual_brief != ''
        env:
          MANUAL_BRIEF: ${{ steps.input.outputs.manual_brief }}
        run: printf '%s' "$MANUAL_BRIEF" > source.txt

      - name: Installera Claude Code + Surprise-plugin
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin marketplace add davidboorg/surprise-skills || true
          claude plugin install surprise-canon@surprise-skills || true

      - name: Klona golden-path starter (privat → PAT)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/davidboorg/surprise-starter.git" generated
          rm -rf generated/.git

      - name: Analys + /new-build (Claude headless)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FREEPIK_API_KEY: ${{ secrets.FREEPIK_API_KEY }}
          PROJECT_NAME: ${{ steps.input.outputs.project_name }}
        run: |
          claude -p "Läs källan i ./source.txt (mötestranskript eller brief). \
          Projektet finns REDAN i ./generated (golden-path surprise-starter med scripts/genimage.mjs, designsystem och komponenter — klona inte om). \
          Härled ett kebab-case projektnamn (eller använd '$PROJECT_NAME' om satt), anpassa hero + sektioner i ./generated från innehållet (kör tonen genom Canon). \
          GENERERA BILDER: för de visuella element briefen kräver (avatar, hero, og-image), kör inifrån ./generated \
          'node scripts/genimage.mjs \"<engelsk bildprompt>\" public/images/<namn>.png <aspect_ratio>' \
          (FREEPIK_API_KEY finns i env; aspect: square_1_1/widescreen_16_9/social_story_9_16) och referera bilderna i sidan. \
          Max 3 bilder. Hoppa över om briefen inte behöver bild. \
          Kör sedan 'npm install && npm run build' i ./generated tills bygget är grönt. \
          Skriv till slut projektnamnet till ./project-name.txt och en enradsbeskrivning till ./project-desc.txt." \
          --allowedTools "Bash,Read,Edit,Write" --permission-mode acceptEdits

      - name: Deploya preview till Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          cd generated
          npm install -g vercel
          URL=$(vercel deploy --yes --token "$VERCEL_TOKEN" 2>/dev/null | tail -1)
          echo "$URL" > "$GITHUB_WORKSPACE/preview-url.txt"

      - name: Verifiera (Playwright + brand-check)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npm i playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          PREVIEW_URL="$(cat preview-url.txt)" node scripts/verify.mjs || true
          echo "Verdikt: $(node -e "console.log(require('./verify-out/verdict.json').verdict)" 2>/dev/null || echo okänt)"

      - name: Reparera (en iteration vid block-fel)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FREEPIK_API_KEY: ${{ secrets.FREEPIK_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          V=$(node -e "console.log(require('./verify-out/verdict.json').verdict)" 2>/dev/null || echo pass)
          if [ "$V" != "fail" ]; then echo "Verdikt pass — ingen reparation."; exit 0; fi
          echo "Verdikt fail — kör EN reparations-iteration."
          claude -p "Brand-verifieringen underkände prototypen i ./generated. Violations (JSON): $(cat verify-out/verdict.json). Åtgärda dessa i ./generated enligt reglerna (palett/typografi/copy/layout), kör 'npm run build' tills grönt. Ändra inget annat." \
            --allowedTools "Bash,Read,Edit,Write" --permission-mode acceptEdits || true
          cd generated && URL=$(vercel deploy --yes --token "$VERCEL_TOKEN" 2>/dev/null | tail -1) && echo "$URL" > "$GITHUB_WORKSPACE/preview-url.txt"
          cd "$GITHUB_WORKSPACE"
          PREVIEW_URL="$(cat preview-url.txt)" node scripts/verify.mjs || true
          echo "Verdikt efter reparation: $(node -e "console.log(require('./verify-out/verdict.json').verdict)" 2>/dev/null || echo okänt)"

      - name: Öppna PR med /lab-kort + screenshots
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          NAME=$(cat project-name.txt 2>/dev/null || echo "ny-prototyp")
          DESC=$(cat project-desc.txt 2>/dev/null || echo "Auto-genererad prototyp.")
          PREVIEW_URL=$(cat preview-url.txt 2>/dev/null || echo "#")
          VERDICT=$(node -e "console.log(require('./verify-out/verdict.json').verdict)" 2>/dev/null || echo pass)
          VIOL=$(node -e "const v=require('./verify-out/verdict.json').violations||[]; console.log(v.map(x=>'- ['+x.severity+'] '+x.rule+': '+x.where).join('\n')||'inga')" 2>/dev/null || echo "inga")
          BRANCH="autobuild/$NAME-${{ github.run_id }}"
          export NAME DESC PREVIEW_URL
          git config user.name "surprise-autobuild"
          git config user.email "bot@surpriseventures.io"
          git config --local --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/davidboorg/surprisesystems.git"
          git checkout -b "$BRANCH"
          # concept-kort i projects.ts
          node -e "
            const fs=require('fs'); const f='src/lib/projects.ts'; let s=fs.readFileSync(f,'utf8');
            const card='  {\n    title: '+JSON.stringify(process.env.NAME)+',\n    description: '+JSON.stringify(process.env.DESC)+',\n    status: \"concept\",\n    url: '+JSON.stringify(process.env.PREVIEW_URL)+',\n    tags: [\"prototype\",\"autobuild\"],\n  },\n';
            const i=s.lastIndexOf('];'); s=s.slice(0,i)+card+s.slice(i); fs.writeFileSync(f,s);
          "
          # screenshots → previews/ på grenen
          mkdir -p previews && cp verify-out/desktop.png verify-out/mobile.png previews/ 2>/dev/null || true
          git add src/lib/projects.ts previews
          git commit -m "Autobuild: $NAME på /lab (preview: $PREVIEW_URL, verify: $VERDICT)"
          git push origin "$BRANCH"
          RAW="https://raw.githubusercontent.com/davidboorg/surprisesystems/$BRANCH/previews"
          BODY="Auto-genererad prototyp.

          **Preview:** $PREVIEW_URL
          **Verify:** $VERDICT

          Desktop: $RAW/desktop.png
          Mobil: $RAW/mobile.png

          **Violations:**
          $VIOL

          Granska och merge:a för att promota kortet på /lab."
          LABEL=""
          if [ "$VERDICT" = "fail" ]; then
            gh label create "verify:failed" --color B60205 --repo davidboorg/surprisesystems 2>/dev/null || true
            LABEL="--label verify:failed"
          fi
          gh pr create --title "Autobuild: $NAME" --body "$BODY" --base main --head "$BRANCH" $LABEL
